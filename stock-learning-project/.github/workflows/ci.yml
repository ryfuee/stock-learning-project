name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Syntax check
        run: |
          node -c scripts/generate-research.mjs
          node -c scripts/live-paper-trader.mjs
          node -c server/server.mjs
      - name: Docker build
        run: docker build -t a-share-research-app .
