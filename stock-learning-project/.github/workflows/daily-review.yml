name: Daily A-share Review

on:
  workflow_dispatch:
  schedule:
    # A-share post-close, 15:55 Asia/Shanghai = 07:55 UTC.
    # GitHub schedules can be delayed; the VPS remains the source of truth for live simulation.
    - cron: "55 7 * * 1-5"

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Generate daily research report
        env:
          MARKET_NOTES_DIR: ../02-market-notes
        run: node scripts/generate-research.mjs
      - name: Commit generated review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json ../02-market-notes/daily-research || true
          git diff --cached --quiet || git commit -m "chore: update daily A-share review"
          git push
